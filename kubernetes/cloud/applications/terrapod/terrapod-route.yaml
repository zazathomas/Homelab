# Terrapod UI and API
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: terrapod-route
  namespace: terrapod
spec:
  parentRefs:
  - name: cf-envoy-gw
    namespace: gateway
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - "terrapod.z3cyber.tech"
  rules:
  - backendRefs:
    - name: terrapod-web
      port: 3000
      group: ''
      kind: Service
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
