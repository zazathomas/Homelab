apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghost-backup
  namespace: ghost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ghost-backup
  namespace: ghost
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/scale
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ghost-backup
  namespace: ghost
subjects:
  - kind: ServiceAccount
    name: ghost-backup
    namespace: ghost
roleRef:
  kind: Role
  name: ghost-backup
  apiGroup: rbac.authorization.k8s.io
