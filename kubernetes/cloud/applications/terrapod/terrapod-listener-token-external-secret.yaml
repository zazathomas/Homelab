apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrapod-listener-token
  namespace: terrapod
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault-secretstore
  target:
    name: terrapod-listener-token
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: join_token
      remoteRef:
        key: oci-terrapod-secret
        property: agent_pool_join_token
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
