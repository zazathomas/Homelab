---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gateway-csrf-policy
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gw
  csrf:
    shadowFraction:
      numerator: 100
    additionalOrigins:
      - "https://z3cyber.tech"
      - "https://*.z3cyber.tech"
