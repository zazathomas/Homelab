apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-restore
  namespace: databases
spec:
  instances: 2
  bootstrap:
    recovery:
      source: example-db-backups
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: r2-store
  externalClusters:
  - name: example-db-backups
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: r2-store
        serverName: example-db
  storage:
    size: 1Gi
