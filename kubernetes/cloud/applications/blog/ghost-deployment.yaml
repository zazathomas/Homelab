apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: ghost
  labels:
    app: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
    spec:
      securityContext:               
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: ghost
        image: docker.io/ghost:6.72.0
        ports:
        - containerPort: 2368
        env:
        - name: database__client
          value: sqlite3
        - name: database__connection__filename
          value: "/var/lib/ghost/content/data/ghost.db"
        - name: url
          value: https://blog.z3cyber.tech
        - name: optimization__allowLimitAll
          value: "true"
        volumeMounts:
        - name: ghost-data
          mountPath: /var/lib/ghost/content
        - name: ghost-theme
          mountPath: /var/lib/ghost/content/themes/opencode
          readOnly: true
        envFrom:
        - secretRef:
            name: ghost-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1000Mi"
            cpu: "1000m"
      volumes:
      - name: ghost-data
        persistentVolumeClaim:
          claimName: ghost-pvc
      - name: ghost-theme
        configMap:
          name: ghost-theme
          items:
          - key: default.hbs
            path: default.hbs
          - key: error.hbs
            path: error.hbs
          - key: index.hbs
            path: index.hbs
          - key: page-search.hbs
            path: page-search.hbs
          - key: page.hbs
            path: page.hbs
          - key: post.hbs
            path: post.hbs
          - key: tag.hbs
            path: tag.hbs
          - key: package.json
            path: package.json
          - key: screen.css
            path: assets/css/screen.css
          - key: opencode.js
            path: assets/js/opencode.js
          - key: highlight.LICENSE
            path: assets/js/vendor/highlight.LICENSE
          - key: highlight.min.js
            path: assets/js/vendor/highlight.min.js
          - key: IBMPlexMono-Medium.woff2
            path: assets/fonts/IBMPlexMono-Medium.woff2
          - key: IBMPlexMono-Regular.woff2
            path: assets/fonts/IBMPlexMono-Regular.woff2
          - key: IBMPlexMono-SemiBold.woff2
            path: assets/fonts/IBMPlexMono-SemiBold.woff2
          - key: IBMPlexSans-Regular.woff2
            path: assets/fonts/IBMPlexSans-Regular.woff2
          - key: IBMPlexSans-SemiBold.woff2
            path: assets/fonts/IBMPlexSans-SemiBold.woff2
          - key: nav.hbs
            path: partials/nav.hbs
          - key: pagination.hbs
            path: partials/pagination.hbs
          - key: post-hero.hbs
            path: partials/post-hero.hbs
          - key: post-row.hbs
            path: partials/post-row.hbs
          - key: rail-tag-open.hbs
            path: partials/rail-tag-open.hbs
          - key: rail.hbs
            path: partials/rail.hbs
