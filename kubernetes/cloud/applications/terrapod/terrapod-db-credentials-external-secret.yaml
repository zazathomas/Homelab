apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrapod-credentials
  namespace: databases
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault-secretstore
  target:
    name: terrapod-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .db_username }}"
        password: "{{ .db_password }}"
        url: "postgresql+asyncpg://{{ .db_username | urlquery }}:{{ .db_password | urlquery }}@terrapod-db-rw.databases.svc.cluster.local:5432/terrapod"
        admin_email: "{{ .admin_email }}"
        admin_password: "{{ .admin_password }}"
        webhook_secret: "{{ .webhook_secret }}"
  dataFrom:
    - extract:
        key: oci-terrapod-secret
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
