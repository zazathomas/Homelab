apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - redis.yaml
  - https://raw.githubusercontent.com/envoyproxy/gateway/v1.9.1/examples/kubernetes/geoip-anonymous-ip-db.yaml
  - gatewayclass.yaml
  - envoy-gw.yaml
  - cf-envoy-gw.yaml
  - http-redirect.yaml
  - detect-ip-policy.yaml
  - cf-detect-ip-policy.yaml
  - global-ratelimit-policy.yaml
  - gateway-csrf-policy.yaml
  - gateway-geoip-policy.yaml
  - gateway-cel-policy.yaml
  - gateway-oidc-policy.yaml
  - gw-client-secret.yaml
  # - podmonitors.yaml
  # - kubewaf-policy.yaml
  - envoy-proxy-config.yaml


helmCharts:
- name: gateway-helm
  namespace: envoy-gateway-system
  repo: oci://docker.io/envoyproxy
  version: v1.9.1
  releaseName: envoy-gateway
  valuesFile: values.yaml
  includeCRDs: true
