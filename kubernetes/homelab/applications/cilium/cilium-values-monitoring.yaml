# Enable Operator metrics
operator:
  prometheus:
    enabled: true
    port: 9963

# Enable cilium agent(& Envoy) metrics
prometheus:
  enabled: true
  port: 9965

# Configure envoy metrics port
envoy:
  prometheus:
    port: "9964"

# Enable Hubble metrics
hubble:
  metrics:
    port: 9966
    enableOpenMetrics: true
    enabled: [dns, drop, tcp, flow, icmp, port-distribution]
  export:
    dynamic:
      enabled: true
      config:
        content:
        - name: "dropped-flows"
          filePath: "/var/run/cilium/hubble/dropped-flows.log"
          fieldMask: []
          includeFilters:
          - verdict: ["DROPPED","ERROR"]
          excludeFilters: 
          - source_pod: ["tailscale/"]
          - destination_pod: ["tailscale/"]
        - name: "coredns"
          filePath: "/var/run/cilium/hubble/coredns.log"
          fieldMask: ["time", "source.namespace", "source.pod_name", "destination.namespace", "destination.pod_name", "verdict", "Summary"]
          includeFilters:
          - source_label: ["k8s-app=kube-dns"]
          - destination_label: ["k8s-app=kube-dns"]
          excludeFilters: []
        - name: "ingress-access"
          filePath: "/var/run/cilium/hubble/ingress-access.log"
          fieldMask: []
          includeFilters:
          - source_identity: [2]
            destination_identity: [8]
            traffic_direction: ["INGRESS"]
          excludeFilters: []

  tls:
    auto:
      enabled: true
      method: cronJob
      certValidityDuration: 1095
      schedule: "0 0 1 */4 *"

# Disable certgen's hard check that the CA stays valid for the full leaf
# duration (default true in v1.20+). Without this, the hubble-generate-certs
# cronJob fails once the existing CA has less than certValidityDuration
# (1095 days) of validity remaining.
certgen:
  enforceCAValidityThroughoutLeavesDuration: false
 