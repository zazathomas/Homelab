apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yml
  - argocd-external-secret.yaml
  - argocd-route.yaml

helmCharts:
- name: argo-cd
  namespace: argocd
  repo: https://argoproj.github.io/argo-helm
  version: 10.11.1
  releaseName: argocd
  valuesFile: argocd-values.yml