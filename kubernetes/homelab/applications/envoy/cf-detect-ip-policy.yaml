---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: cf-detect-ip-policy
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cf-envoy-gw
  clientIPDetection:
    customHeader:
      name: "cf-connecting-ip"
      failClosed: true
