apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3-ui-route
  namespace: rustfs
spec:
  parentRefs:
  - name: cf-envoy-gw
    namespace: gateway
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - "s3.z3cyber.tech"
  rules:
  - backendRefs:
      - name: rustfs-svc
        port: 9001
        group: ''	
        kind: Service
        weight: 1
    matches:	
      - path:	
          type: PathPrefix	
          value: /