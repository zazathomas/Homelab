apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Keep Kustomize's downloaded chart outside the conventional `charts/`
# directory, which may be left behind in Argo CD's source cache.
helmGlobals:
  chartHome: .helm-charts

helmCharts:
- name: cilium
  namespace: kube-system
  repo: https://helm.cilium.io
  version: 1.20.4
  releaseName: cilium
  valuesFile: cilium-values-cloud.yaml
  additionalValuesFiles:
  - cilium-values-monitoring.yaml