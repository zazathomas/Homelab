apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen-route
  namespace: ai-inference
spec:
  parentRefs:
    - name: envoy-gw
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - qwen.k8s.z3cyber.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: "0s"
        backendRequest: "0s"
      backendRefs:
        - name: qwen
          namespace: ai-inference
          group: ""
          kind: Service
          port: 8080
          weight: 1