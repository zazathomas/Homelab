---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gateway-geoip-policy
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gw
  authorization:
    defaultAction: Allow
    rules:
      - name: deny-anonymous-networks
        action: Deny
        principal:
          clientIPGeoLocations:
            - anonymous:
                isAnonymous: true
            - anonymous:
                isVPN: true
            - anonymous:
                isTor: true
            - anonymous:
                isProxy: true
