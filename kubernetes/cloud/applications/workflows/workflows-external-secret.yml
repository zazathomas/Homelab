apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workflows-secrets
  namespace: argo
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault-secretstore
  target:
    name: workflows-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: oci-workflows-secrets
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
