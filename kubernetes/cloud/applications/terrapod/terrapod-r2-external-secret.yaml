apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrapod-r2-credentials
  namespace: terrapod
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault-secretstore
  target:
    name: terrapod-r2-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: oci-r2-creds
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
