#values.yaml
upgradeCompatibility: "1.19"
k8sServiceHost: "192.168.20.200" # This IP should be the IP of the master node
k8sServicePort: "6443"
kubeProxyReplacement: true
ipam:
  mode: kubernetes
  operator:
    clusterPoolIPv4PodCIDRList: "10.244.0.0/16"

# Announce IPs from services' `.status.loadbalancer.ingress` field (automatically assigned by LB-IPAM).
l2announcements:
  enabled: true

# Enable Gateway API
gatewayAPI:
  enabled: false
  externalTrafficPolicy: Local
  #xffNumTrustedHops: 1
  
# Enable envoy
envoy:
  enabled: false
  rollOutPods: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - SYS_ADMIN

# Ztunnel provides transparent L4 encryption + mTLS for enrolled namespaces,
# replacing the deprecated SPIRE-based mutual authentication feature.
# Requires a pre-created `cilium-ztunnel-secrets` Secret in kube-system and
# per-namespace enrollment via `io.cilium/mtls-enabled=true`.
authentication:
  enabled: false
  mutual:
    spire:
      enabled: false
      install:
        enabled: false

encryption:
  enabled: true
  type: ztunnel
  ztunnel:
    ca:
      type: internal


# Increase rate limit when doing L2 announcements
k8sClientRateLimit:
  qps: 50
  burst: 200
  
operator:
  replicas: 1  # Uncomment this if you only have one node
  rollOutPods: true
# Roll out cilium agent pods automatically when ConfigMap is updated.
rollOutCiliumPods: true

# Enable Hubble
hubble:
  enabled: true
  relay:
    enabled: true
    rollOutPods: true
  ui:
    enabled: true
    rollOutPods: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: "/sys/fs/cgroup"