apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cilium-ztunnel-secrets
  namespace: kube-system
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault-secretstore
  target:
    name: cilium-ztunnel-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: cilium-ztunnel-secrets # Key in the OCI Vault
        metadataPolicy: None
