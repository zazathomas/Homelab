# Public webhook prefix on the main Terrapod hostname.
# The Gateway strips /webhooks/ before forwarding to the Terrapod web BFF,
# which proxies the resulting /api/terrapod/v1/* path to the API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: terrapod-webhook-route
  namespace: terrapod
spec:
  parentRefs:
    - name: cf-envoy-gw
      namespace: gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - terrapod.z3cyber.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhooks/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: terrapod-web
          port: 3000
          group: ""
          kind: Service
          weight: 1
