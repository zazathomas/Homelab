apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - api-route.yaml
  - route.yaml
  - rustfs-external-secret.yaml


helmCharts:
- name: rustfs
  namespace: rustfs
  repo: https://charts.rustfs.com
  version: 1.0.3
  releaseName: rustfs
  valuesFile: rustfs-values.yaml