apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-creds
  namespace: rustfs
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault-secretstore
  target:
    name: rustfs-creds
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: oci-rustfs-creds
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
